<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Todo</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>할 일 목록</h1>
    </header>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="할 일을 입력하세요"
        maxlength="200"
        required
      >
      <button id="add-btn" class="add-btn" type="submit">추가</button>
    </form>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <p id="empty-message" class="empty-message" hidden>아직 할 일이 없습니다.</p>
  </main>
</body>
</html>
